version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: registry_postgres
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - registry_net

  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    volumes:
      - ./backend/certs:/auth
      - registry_data:/var/lib/registry
    environment:
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: http://backend:6500/api/auth
      REGISTRY_AUTH_TOKEN_SERVICE: registry
      REGISTRY_AUTH_TOKEN_ISSUER: my-auth-server
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /auth/auth.cert
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_NOTIFICATIONS_ENDPOINTS: |
        - name: backend-webhook
          disabled: false
          url: http://backend:6500/api/registry/webhook
          headers:
             Authorization: [Bearer webhook_internal]
          timeout: 500ms
          threshold: 5
          backoff: 1s
    restart: unless-stopped
    networks:
      - registry_net

  backend:
    build: ./backend
    container_name: registry_backend
    ports:
      - "6500:6500"
    environment:
      PORT: 6500
      HOST: "0.0.0.0"
      REGISTRY_PUBLIC_URL: http://registry:5000
      REGISTRY_CONTAINER_NAME: registry
      # REGISTRY_HOST: ip:5000 mandetory field
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: registry
      DB_PASS: registry123
      DB_NAME: registry
      JWT_SECRET: mkEjSjBN$&nb&km585Mnt
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123

    depends_on:
      - postgres
      - registry
    restart: unless-stopped
    networks:
      - registry_net

  frontend:
    build: ./frontend
    container_name: registry_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:6500
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - registry_net

networks:
  registry_net:
    driver: bridge

volumes:
  postgres_data:
  registry_data: