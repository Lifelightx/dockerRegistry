<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2544"/>
      <stop offset="100%" stop-color="#1a3a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Container bottom face -->
  <rect x="10" y="34" width="44" height="18" rx="3" fill="#1e3a5f" stroke="url(#accent)" stroke-width="1.2"/>

  <!-- Container top face (lid) -->
  <rect x="10" y="22" width="44" height="14" rx="3" fill="#1a3060" stroke="url(#accent)" stroke-width="1.2"/>

  <!-- Horizontal dividers (container lines) -->
  <line x1="10" y1="36" x2="54" y2="36" stroke="url(#accent)" stroke-width="0.8" opacity="0.5"/>
  <line x1="10" y1="43" x2="54" y2="43" stroke="url(#accent)" stroke-width="0.8" opacity="0.5"/>

  <!-- Vertical separators -->
  <line x1="28" y1="22" x2="28" y2="52" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
  <line x1="42" y1="22" x2="42" y2="52" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>

  <!-- "R" letter monogram -->
  <text x="32" y="20" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="url(#accent)" letter-spacing="0.5">REG</text>

  <!-- Accent dots (status indicators) -->
  <circle cx="16" cy="47" r="2.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="23" cy="47" r="2.5" fill="#818cf8" opacity="0.9"/>
  <circle cx="30" cy="47" r="2.5" fill="#38bdf8" opacity="0.5"/>
</svg>
